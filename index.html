<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Journeys | Crestwood Oral History Project</title>
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
  <meta name="description" content="Explore places named in Crestwood interviews with
    Holocaust survivors, veterans, and community members." />
  <meta property="og:title" content="Journeys | Crestwood Oral History Project" />
  <meta property="og:description" content="Follow one recorded route or compare places
    across the Crestwood Oral History Project." />

  <link rel="preload" href="vendor/fonts/spectral-500.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="preload" href="vendor/fonts/public-sans-400.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <a class="skip-link" href="#map">Skip to the map</a>

  <svg class="icon-sprite" aria-hidden="true">
    <symbol id="icon-arrow-right" viewBox="0 0 24 24">
      <path d="M5 12h13M14 7l5 5-5 5" />
    </symbol>
    <symbol id="icon-external-link" viewBox="0 0 24 24">
      <path d="M14 5h5v5M19 5l-8 8M18 13v5a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5" />
    </symbol>
    <symbol id="icon-close" viewBox="0 0 24 24">
      <path d="m7 7 10 10M17 7 7 17" />
    </symbol>
    <symbol id="icon-search" viewBox="0 0 24 24">
      <circle cx="11" cy="11" r="6" />
      <path d="m16 16 4 4" />
    </symbol>
  </svg>

  <div id="stage">
    <div id="portrait-field" aria-hidden="true"></div>
    <!-- persistent vector map -->
    <main id="map" tabindex="-1" role="application" aria-label="Map of oral history journeys"></main>
    <div id="tip" class="tip" aria-hidden="true"></div>

    <!-- loading / error -->
    <div id="loading" class="cover atlas-cover" role="status" aria-live="polite">
      <div class="loading-globe" aria-hidden="true">
        <span class="loading-arc"><i></i></span>
      </div>
      <div class="cover-inner loading-identity">
        <p class="loading-title">Journeys</p>
        <p class="loading-kicker">Crestwood oral history project</p>
        <span class="loading-rule" aria-hidden="true"><i></i></span>
        <p class="loading-status">Opening the archive</p>
      </div>
    </div>
    <div id="error" class="cover" hidden>
      <div class="cover-inner">
        <p class="serif lg">The map could not load.</p>
        <p class="muted">Reload the page when you have an internet connection.</p>
      </div>
    </div>

    <!-- top bar -->
    <header id="topbar" class="topbar" hidden>
      <button class="brand" data-act="home" title="Back to the start">
        <span class="brand-title">Journeys</span>
        <span class="brand-kicker">Crestwood OHP</span>
      </button>
      <nav class="nav" role="tablist" aria-label="View modes">
        <button class="nav-tab" role="tab" data-view="guided" title="Follow one recorded route">Guided</button>
        <button class="nav-tab" role="tab" data-view="explore" title="Search people and places, or filter by community">Explore</button>
        <button class="nav-tab" role="tab" data-view="patterns" title="Compare routes, birthplaces, and historical borders">Patterns</button>
      </nav>
      <div class="topbar-right">
        <button class="nav-plain" data-view="about">About</button>
      </div>
    </header>

    <!-- overlay (filled per view) -->
    <div id="overlay"></div>
  </div>

  <p id="fatal" class="fatal" hidden role="alert"></p>

  <script src="vendor/gsap/gsap.min.js"></script>
  <script src="vendor/d3/d3.min.js"></script>
  <script src="vendor/topojson/topojson-client.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
