# Cloudflare Worker config (doc 09 Part 2 — auto-update native to Cloudflare).
#
# Deploys with NO manual setup: a [build] step assembles a clean ./public site
# (the committed archive dataset included) and the Worker serves it. Workers KV
# keeps the live archive current between deployments.
#
# Cloudflare Workers Builds runs `npx wrangler deploy` on push to main; wrangler runs
# the [build] command first. The Worker name must match the Cloudflare project.

name = "ohpmap"
main = "worker/index.js"
compatibility_date = "2024-11-01"

# Assemble only the static site into ./public (keeps .git, tooling, and source out of
# what's served — see tools/assemble_site.cjs).
[build]
# Production restores the actually published predecessor, even in a clean clone.
# `node tools/assemble_site.cjs` remains the offline/local build command.
command = "node tools/assemble_site.cjs --restore-published"

# The Worker owns routing, headers and real 404s for every response. Static assets
# never apply SPA fallbacks or implicit .html redirects to immutable data paths.
[assets]
directory = "public"
binding = "ASSETS"
run_worker_first = true
html_handling = "none"
not_found_handling = "none"

[vars]
SITE_ORIGIN = "https://ohpmap.alexdong0414.workers.dev"

# Every hour, discover additions across all OHP categories and refresh a rotating
# batch of existing profiles. This keeps source load bounded while covering the
# full archive roughly every two days.
[triggers]
crons = ["7 * * * *"]

[[kv_namespaces]]
binding = "OHP_DATA"
id = "071340c283684dcd9d7dd97bc1e05248"

[[durable_objects.bindings]]
name = "ARCHIVE_SYNC"
class_name = "ArchiveSync"

[[migrations]]
tag = "archive-sync-v1"
new_sqlite_classes = ["ArchiveSync"]
